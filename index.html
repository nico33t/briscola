<!doctype html>
<html lang="it" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Briscola — carte piacentine</title>
    <meta
      name="description"
      content="Briscola con le carte piacentine. Offline, senza account, senza pubblicità."
    />

    <!-- Il verde arriva anche alla barra del browser e alla barra di stato:
         una striscia bianca sopra un tavolo verde tradisce subito che è un sito. -->
    <meta name="theme-color" content="#012918" />
    <meta name="color-scheme" content="dark" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- iOS non legge il manifest: vuole i suoi meta per aprirsi a tutto schermo. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Briscola" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:title" content="Briscola — carte piacentine" />
    <meta
      property="og:description"
      content="Briscola con le carte piacentine. Offline, senza account, senza pubblicità."
    />
    <meta property="og:image" content="./icon-512.png" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
